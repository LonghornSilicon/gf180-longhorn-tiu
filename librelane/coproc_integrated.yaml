# coproc_integrated.yaml — harden the KVE+TIU coprocessor into the Chipathon-
# provided padframe DEF (shared-reticle integration / trial run).
#
# The integration lead returns a project DEF (padframe + our pin placement, sized
# from info.yaml). FP_DEF_TEMPLATE makes LibreLane use that DEF's die area + pin
# locations, and maps coproc_top's ports to the DEF pins by name.
#
# DEF-DAY procedure (see docs/INTEGRATION.md):
#   1. Drop the org DEF at def/<name>.def
#   2. Point FP_DEF_TEMPLATE below at it
#   3. Verify pin names/power nets match coproc_top.sv (adjust if needed)
#   4. Harden:  make coproc-integrated   (or the librelane cmd in the Makefile)
#
# NOTE: values marked TODO(DEF-day) can only be finalized once the DEF is in hand.

meta:
  version: 3
  flow: Classic

DESIGN_NAME: coproc_top
PDK: gf180mcuD
USE_SLANG: true

VERILOG_FILES:
  - dir::../src/coproc_top.sv             # integration top (scalar ports = info.yaml pins)
  - dir::../src/lambda_kv_coproc.sv
  - dir::../src/spi_loader.sv
  - dir::../src/precision_controller.sv
  - dir::../src/token_importance_unit.sv
  - dir::../src/wht_unit_syn.sv
  - dir::../src/fp16_addsub_syn.sv
  - dir::../src/cq_units_syn.sv
  - dir::../src/cq_value_path_wht_syn.sv

SYNTH_PARAMETERS:
  - D=2
  - L=2

CLOCK_PORT: clk
CLOCK_NET: clk
CLOCK_PERIOD: 300     # ns — closes the ~285 ns combinational CQ-3 value path

# --- Org padframe DEF: die area + pin placement are taken from this template. ---
# DELIVERED 2026-08-26 (variants BV + BH; see def/A71_selected_variants.json).
# BV slot = 550 x 1110 um; our core (502.89 x 520.81 um) fits with margin. The
# BV pad map matches info.yaml exactly (VSS pin1..VDD pin12, all io_types) — see
# def/A71_BV/A71_BV_pad_map.yaml. Swap to def/A71_BH/A71_BH.def for the BH slot.
#
# NOTE: running this integrated harden as-is will NOT route cleanly — A71_BV.def
# exposes the full gf180 pad core-side interface (67 pins: <pin>_IN/_OUT/_OE/_IE/
# _CS/_SL/_PU/_PD/_PDRV0/_PDRV1 for bidir pads, <pin>+_PU/_PD for inputs), not the
# scalar ports coproc_top currently has. A pad-adapter wrapper (drive _OE, tie off
# _IN, set config bits) is required first. The org's scripted integration wires our
# scalar-labeled core GDS into these pads on their side, so this trial is optional.
FP_DEF_TEMPLATE: dir::../def/A71_BV/A71_BV.def
FP_SIZING: absolute

# Power nets — CONFIRMED against the delivered DEF: VDD (pad N01, gf180 dvdd) and
# VSS (pad W12, gf180 dvss), both uppercase, USE POWER/GROUND in A71_BV.def.
VDD_NETS:
  - VDD
GND_NETS:
  - VSS

# The DEF template fixes pin locations, so no pin auto-placement.
# TODO(DEF-day): if the DEF already carries PDN rings/straps, keep PDN minimal;
# otherwise add a PDN_CFG. Confirm whether the padframe or our core owns the ring.
GRT_ALLOW_CONGESTION: true
RUN_POST_GRT_DESIGN_REPAIR: true
RUN_POST_GRT_RESIZER_TIMING: true

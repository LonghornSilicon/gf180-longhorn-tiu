# data will be pulled from the default branch of this repo.
# please be sure that the branch contains the data you want to submit.

project:
  title: "Lambda KV-Cache Coprocessor (KVE + TIU)"
  team: "Longhorn Silicon (A71)"
  discord: "changa"
  description: "SPI-streamed KV-cache value compression + token-importance/eviction coprocessor — RTL to GDS by an LLM agent (Track D)."
  lvs_config: "lvs_config.json"

# Core-only preintegration block (no pads). The org generates the padframe from
# this pin list + the core area and returns a DEF. Everything streams over a
# 4-wire SPI slave, so the footprint is small: 6 functional pins + 4 status pins.
# No output-only digital pad exists in the GF180 IO library, so spi_miso and the
# obs status bits are declared bidirectional (used as outputs).
#
#   Host protocol (SPI mode 0, MSB-first): CMD {WRITE/READ/START/STATUS}, ADDR[15:8],
#   ADDR[7:0], DATA... The host writes value tokens (V) + attention masses (W),
#   pulses START, polls STATUS, then reads back CODES/SCALE/VHAT + the decision byte
#   (evict slot, keep-tier bitmap, precision gate).
pins:
  # --- dedicated control ---
  - name: clk
    io_type: input_schmitt
  - name: rst_n
    io_type: input_cmos

  # --- 4-wire SPI slave ---
  - name: spi_sclk
    io_type: input_cmos
  - name: spi_cs_n
    io_type: input_cmos
  - name: spi_mosi
    io_type: input_cmos
  - name: spi_miso
    io_type: bidirectional      # output-only in practice

  # --- 4-bit status observation = {busy, done, err, gate_fp16} ---
  - name: obs0                   # busy
    io_type: bidirectional
  - name: obs1                   # done
    io_type: bidirectional
  - name: obs2                   # err
    io_type: bidirectional
  - name: obs3                   # gate_fp16
    io_type: bidirectional

  # --- power ---
  - name: vdd
    io_type: power
  - name: vss
    io_type: ground
